<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Membuat Grafik dengan JS dan CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div>
        <canvas id="myChart"></canvas>
    </div>


    <!-- Memuat Chart.js dari CDN -->
    <script>
        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
                datasets: [{
                    label: '# of Votes',
                    data: [10, 13, 2, 5, 20, 17],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

</body>

</html>
